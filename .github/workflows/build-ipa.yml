name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Keeper IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          echo "Available Xcode installations on runner:"
          ls -d /Applications/Xcode*.app || true

          SELECTED_XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SELECTED_XCODE" ]; then
            SELECTED_XCODE=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -n "$SELECTED_XCODE" ]; then
            echo "Selecting Xcode: $SELECTED_XCODE"
            sudo xcode-select -s "$SELECTED_XCODE"
            echo "DEVELOPER_DIR=$SELECTED_XCODE/Contents/Developer" >> $GITHUB_ENV
            export DEVELOPER_DIR="$SELECTED_XCODE/Contents/Developer"
          else
            echo "Warning: Xcode 16/15 not found. Looking for non-26 Xcode..."
            FALLBACK_XCODE=$(ls -d /Applications/Xcode*.app 2>/dev/null | grep -v "Xcode_26" | sort -V | tail -n 1 || true)
            if [ -n "$FALLBACK_XCODE" ]; then
              echo "Selecting fallback: $FALLBACK_XCODE"
              sudo xcode-select -s "$FALLBACK_XCODE"
              echo "DEVELOPER_DIR=$FALLBACK_XCODE/Contents/Developer" >> $GITHUB_ENV
              export DEVELOPER_DIR="$FALLBACK_XCODE/Contents/Developer"
            fi
          fi

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Provision Firebase Config Stubs
        run: |
          chmod -R +x scripts/ || true
          chmod -R +x ci_scripts/ || true
          sh scripts/firebase/provision_firebase.sh

      - name: Build Keeper App (Unsigned)
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/Configurations/PackageBuildSettings.xcconfig
          CLONED_SOURCE_PACKAGES_DIR: ${{ github.workspace }}/build/DerivedData/SourcePackages
        run: |
          set -o pipefail
          xcodebuild \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_STRICT_CONCURRENCY=minimal \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products -name "Keeper.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Keeper.app not found in build products" >&2
            find build/DerivedData/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "Found Keeper.app at: $APP_PATH"

          # Remove PlugIns (Widget, Intents, Push Notification extensions)
          # Free Apple IDs do not support App Groups or push services and are limited to 3 App IDs.
          # Sideloading fails or crashes on launch when extensions with mismatched entitlements are present.
          rm -rf "$APP_PATH/PlugIns" || true

          # Ensure KeeperResources bundle is a real directory inside Keeper.app, not a symlink
          if [ -L "$APP_PATH/KeeperResources_KeeperResources.bundle" ]; then
            echo "KeeperResources bundle is a symlink, resolving to real folder..."
            rm -f "$APP_PATH/KeeperResources_KeeperResources.bundle"
          fi
          if [ ! -d "$APP_PATH/KeeperResources_KeeperResources.bundle" ]; then
            RES_BUNDLE=$(find build/DerivedData/Build/Products -name "KeeperResources_KeeperResources.bundle" -type d | head -n 1)
            if [ -n "$RES_BUNDLE" ]; then
              echo "Copying KeeperResources bundle from $RES_BUNDLE to $APP_PATH/"
              cp -R "$RES_BUNDLE" "$APP_PATH/"
            fi
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr TonkeeperCustom.ipa Payload
          echo "TonkeeperCustom.ipa created successfully"
          ls -lh TonkeeperCustom.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonkeeperCustom-ipa
          path: TonkeeperCustom.ipa
          if-no-files-found: error
          retention-days: 14
