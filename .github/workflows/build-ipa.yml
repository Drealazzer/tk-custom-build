name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Keeper IPA
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          AVAILABLE_XCODE=$(find /Applications -maxdepth 1 \( -name "Xcode_16*.app" -o -name "Xcode_15*.app" \) 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$AVAILABLE_XCODE" ]; then
            echo "Selected Xcode: $AVAILABLE_XCODE"
            sudo xcode-select -s "$AVAILABLE_XCODE"
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path || true

      - name: Provision Firebase Config Stubs
        run: |
          sh scripts/firebase/provision_firebase.sh

      - name: Build Keeper App (Unsigned)
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/Configurations/PackageBuildSettings.xcconfig
          CLONED_SOURCE_PACKAGES_DIR: ${{ github.workspace }}/build/DerivedData/SourcePackages
        run: |
          set -o pipefail
          xcodebuild \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products -name "Keeper.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Keeper.app not found in build products" >&2
            find build/DerivedData/Build/Products -maxdepth 3 || true
            exit 1
          fi
          echo "Found Keeper.app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr TonkeeperCustom.ipa Payload
          echo "TonkeeperCustom.ipa created successfully"
          ls -lh TonkeeperCustom.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonkeeperCustom-ipa
          path: TonkeeperCustom.ipa
          if-no-files-found: error
          retention-days: 14
