name: Build Unsigned IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Keeper IPA
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode_15.4.app || true
          xcodebuild -version

      - name: Provision Firebase Config Stubs
        run: |
          sh scripts/firebase/provision_firebase.sh

      - name: Build Keeper App (Unsigned)
        env:
          XCODE_XCCONFIG_FILE: ${{ github.workspace }}/Configurations/PackageBuildSettings.xcconfig
        run: |
          set -o pipefail
          xcodebuild \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperRelease \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          APP_PATH=$(find build/DerivedData/Build/Products -name "Keeper.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Keeper.app not found in build products" >&2
            exit 1
          fi
          echo "Found Keeper.app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr TonkeeperCustom.ipa Payload
          echo "TonkeeperCustom.ipa created successfully"
          ls -lh TonkeeperCustom.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TonkeeperCustom-ipa
          path: TonkeeperCustom.ipa
          if-no-files-found: error
          retention-days: 14
